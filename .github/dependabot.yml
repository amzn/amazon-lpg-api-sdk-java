version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # google-http-client-jackson2 is released with google-http-client and must match its version.
      google-http-client:
        patterns:
          - "com.google.http-client:google-http-client"
          - "com.google.http-client:google-http-client-jackson2"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
