name: Publish to Maven Central
on:
  # A merge to main that changes pom.xml starts the release, but the `check` job
  # below only lets it proceed when pom.xml carries a version with no tag yet
  # (i.e. a version bump). Any other merge is a no-op.
  push:
    branches: [main]
    paths: [pom.xml]
  # Manual runs for re-tries and dry runs.
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, must equal <version> in pom.xml (e.g. 1.0.0)"
        required: true
        type: string
      dryRun:
        description: "Build + sign + bundle only. No upload, tag or GitHub Release."
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-maven-central
  cancel-in-progress: false

jobs:
  check:
    # Decides whether this run is a release. Runs without secrets.
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.v.outputs.release }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: '8'
      - id: v
        name: Is this a new version?
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          POM_VERSION=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          VERSION="${INPUT_VERSION:-$POM_VERSION}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be X.Y.Z"; exit 1; }
          [ "$POM_VERSION" = "$VERSION" ] || { echo "::error::input $VERSION != pom $POM_VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            if [ "$EVENT" = "push" ]; then
              echo "::notice::v$VERSION is already released; pom.xml changed without a version bump. Nothing to do."
              echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::tag v$VERSION already exists"; exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    environment: release            # no required reviewers: secrets scoped to this env, env limited to main; main is branch-protected (approved PR, no admin bypass)
    permissions:
      contents: write               # tag push + GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Corretto 8 + Portal credentials
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: '8'
          cache: maven
          server-id: central                              # == publishingServerId
          server-username-env-var: CENTRAL_TOKEN_USERNAME
          server-password-env-var: CENTRAL_TOKEN_PASSWORD

      - name: Build, sign, upload to Portal (waits for VALIDATED; human clicks Publish)
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}         # ASCII-armored secret key (bc signer)
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          DRY_RUN: ${{ inputs.dryRun }}
        run: |
          set -euo pipefail
          EXTRA=()
          # central-publishing-maven-plugin 0.7.0 binds its skipPublishing parameter to the
          # user property ${skipPublishing}: the bundle is still built, the upload is skipped.
          if [ "$DRY_RUN" = "true" ]; then EXTRA+=(-DskipPublishing=true); fi
          mvn -B -ntp -P release "${EXTRA[@]}" deploy

      - name: Keep bundle as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: central-bundle-${{ env.VERSION }}
          path: target/central-publishing/central-bundle.zip
          if-no-files-found: error

      - name: Tag v${{ env.VERSION }}
        if: ${{ !inputs.dryRun }}
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release $VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"

      - name: GitHub Release (draft until Portal Publish is clicked)
        if: ${{ !inputs.dryRun }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            target/amazon-lpg-api-sdk-java-${{ env.VERSION }}.jar
            target/amazon-lpg-api-sdk-java-${{ env.VERSION }}-sources.jar
            target/amazon-lpg-api-sdk-java-${{ env.VERSION }}-javadoc.jar
